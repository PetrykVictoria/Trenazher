<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бананова місія Грю — домашнє завдання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  color-scheme: light;
  --sky:#E6F1FF; --ink:#1E2A44; --soft:#5B6782;
  --yellow:#FFD43B; --yellow-2:#FFE98A; --yellow-3:#FFF6CC;
  --denim:#2F6FB5; --denim-2:#D7E6FA; --silver:#AEB6C2;
  --card:#FFFFFF; --ok:#2E9D5B; --ok-bg:#DDF5E6; --bad:#C8452E; --bad-bg:#FCE3DD;
  --line:#C9D6EA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --sky:#14203A; --ink:#F2F5FB; --soft:#B3BED3;
    --yellow:#FFD43B; --yellow-2:#7A6416; --yellow-3:#2E2A16;
    --denim:#7FB0F0; --denim-2:#1F3354; --silver:#5E6878;
    --card:#1C2A47; --ok:#6FD39A; --ok-bg:#183A28; --bad:#FF9A85; --bad-bg:#45231C;
    --line:#2F416A;
  }
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--sky); color:var(--ink); font:600 17px/1.5 "Nunito",system-ui,sans-serif; }
#app{ max-width:560px; margin:0 auto; padding:18px 16px 40px; }
h1,h2,h3{ font-family:"Balsamiq Sans","Nunito",sans-serif; line-height:1.15; margin:0; }
button{ font:inherit; cursor:pointer; }
button:focus-visible,input:focus-visible{ outline:3px solid var(--denim); outline-offset:2px; }

/* Окуляр-лічильник: головний візуальний елемент */
.goggle{ width:150px; height:150px; margin:0 auto; border-radius:50%; background:var(--silver);
  padding:14px; box-shadow:inset 0 -6px 0 rgba(0,0,0,.15); position:relative; }
.goggle::before,.goggle::after{ content:""; position:absolute; top:62px; width:34px; height:24px; background:#3A3A3A; border-radius:6px; }
.goggle::before{ left:-26px; } .goggle::after{ right:-26px; }
.lens{ width:100%; height:100%; border-radius:50%; background:#fff; display:grid; place-items:center; border:6px solid #8B94A1; }
.lens b{ font-family:"Balsamiq Sans",sans-serif; font-size:40px; color:#1E2A44; line-height:1; }
.lens small{ display:block; font-size:13px; color:#5B6782; text-align:center; }
.goggle.small{ width:96px; height:96px; padding:9px; }
.goggle.small::before,.goggle.small::after{ top:38px; width:20px; height:16px; }
.goggle.small::before{ left:-16px; } .goggle.small::after{ right:-16px; }
.goggle.small .lens{ border-width:4px; } .goggle.small .lens b{ font-size:26px; }

.hero{ text-align:center; padding:8px 0 18px; }
.hero h1{ font-size:34px; margin-top:18px; }
.hero p{ color:var(--soft); margin:6px 0 0; }

/* Смуга-комбінезон з бананами */
.strip{ background:var(--denim); border-radius:18px; padding:10px; display:grid; grid-template-columns:repeat(11,1fr); gap:5px;
  outline:2px dashed rgba(255,255,255,.55); outline-offset:-6px; margin:12px 0; }
.slot{ aspect-ratio:1; border-radius:10px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:20px; }
.slot.now{ background:rgba(255,255,255,.45); }
.slot.lost{ background:rgba(0,0,0,.18); font-size:15px; }
.slot.got{ animation:pop .45s ease-out; }
@keyframes pop{ 0%{ transform:scale(.3) rotate(-30deg); } 70%{ transform:scale(1.25) rotate(8deg); } 100%{ transform:scale(1); } }
@media (prefers-reduced-motion: reduce){ .slot.got{ animation:none; } }

.card{ background:var(--card); border-radius:22px; padding:18px; border:2px solid var(--line); }
.lbl{ display:block; font-weight:800; margin-bottom:6px; }
.inp{ width:100%; font:800 18px "Nunito",sans-serif; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
.big{ display:block; width:100%; margin-top:12px; padding:15px; border:0; border-radius:16px; font-weight:900; font-size:18px;
  background:var(--yellow); color:#1E2A44; box-shadow:0 4px 0 #D9A900; }
.big:active{ transform:translateY(2px); box-shadow:0 2px 0 #D9A900; }
.big.alt{ background:var(--denim); color:#fff; box-shadow:0 4px 0 #1F4F86; }
.big.ghost{ background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--line); }
.note{ color:var(--soft); font-size:14px; text-align:center; margin:10px 0 0; }

.bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.back{ border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:6px 12px; font-weight:800; }
.count{ font-weight:900; color:var(--soft); }
.topic{ display:inline-block; font-size:13px; font-weight:800; color:var(--denim); background:var(--denim-2); border-radius:999px; padding:2px 10px; margin-bottom:8px; }
.qcard{ background:var(--yellow-3); border:2px solid var(--yellow); border-radius:22px; padding:18px; font-size:19px; font-weight:800; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.opt{ min-height:64px; padding:10px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-weight:800; font-size:18px; }
.opt.right{ background:var(--ok-bg); border-color:var(--ok); }
.opt.wrong{ background:var(--bad-bg); border-color:var(--bad); }
.opt.dim{ opacity:.55; }
.fb{ margin-top:14px; border-radius:18px; padding:14px 16px; }
.fb.ok{ background:var(--ok-bg); } .fb.bad{ background:var(--bad-bg); }
.fb b{ font-size:18px; } .fb p{ margin:6px 0 0; }

.res{ text-align:center; }
.res h2{ font-size:40px; margin-top:16px; }
.rank{ display:inline-block; margin-top:6px; background:var(--yellow); color:#1E2A44; border-radius:999px; padding:4px 16px; font-weight:900; }
.topics{ list-style:none; padding:0; margin:10px 0 0; }
.topics li{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); }
.topics li.weak span:last-child{ color:var(--bad); font-weight:900; }

.tip{ background:var(--yellow-3); border:2px dashed var(--yellow); border-radius:18px; padding:12px 14px; margin:14px 0; }
.task{ margin-top:14px; }
.task h3{ font-family:"Nunito",sans-serif; font-weight:900; font-size:17px; display:flex; gap:10px; align-items:flex-start; }
.n{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--yellow); color:#1E2A44; display:grid; place-items:center; font-family:"Balsamiq Sans",sans-serif; }
.field{ display:grid; grid-template-columns:minmax(64px,auto) 1fr auto; gap:8px; align-items:center; margin-top:10px; }
.fl{ font-weight:800; }
.mark{ min-width:28px; color:var(--soft); font-size:14px; }
.chk{ margin-top:12px; padding:10px 16px; border-radius:12px; border:0; background:var(--denim); color:#fff; font-weight:900; }
.hint{ color:var(--soft); font-size:14px; margin:8px 0 0; }
.katex{ font-size:1.08em; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
/* ===== НАЛАШТУВАННЯ: встав сюди URL вебдодатка Google Apps Script (той самий, що й для тесту «Рататуй») ===== */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwN6irYBfd0Mkrj27BDMZhCJ6XlM6l2WHeDsm7Y7cIrO6jJK2F10oyDABCfKV90xb06/exec";
const TEST_TITLE = "Бананова місія Грю";

/* ===== Питання тесту від легшого до складнішого; перший варіант — правильний (варіанти на екрані перемішуються) ===== */
const QS = [
 {t:"Відношення", q:"У Боба 4 банани, а в Кевіна 20. У скільки разів у Кевіна бананів більше?", o:["у 5 разів","у 4 рази","у 16 разів","на 16"], h:"«У скільки разів» — ділимо більше число на менше: 20 : 4."},
 {t:"Поділ у відношенні", q:"Скільки всього частин у відношенні \\(2 : 3 : 7\\)?", o:["12","42","7","10"], h:"Додаємо всі числа відношення: 2 + 3 + 7."},
{t:"Відношення", q:"Скороти відношення \\(12 : 18\\).", o:["\\(2 : 3\\)","\\(3 : 2\\)","\\(1 : 6\\)","\\(3 : 4\\)"], h:"Поділи обидва числа на найбільший спільний дільник. Для 12 і 18 це 6."},
 {t:"Дроби", q:"Скороти дріб \\(\\frac{18}{24}\\).", o:["\\(\\frac{3}{4}\\)","\\(\\frac{4}{3}\\)","\\(\\frac{3}{8}\\)","\\(\\frac{2}{3}\\)"], h:"Поділи чисельник і знаменник на 6."},
 {t:"Відсотки і десяткові дроби", q:"Запиши десятковий дріб 0,35 у відсотках.", o:["35 %","3,5 %","0,35 %","350 %"], h:"Щоб записати число у відсотках, помнож його на 100."},
 {t:"Відсотки і десяткові дроби", q:"Запиши десятковий дріб 0,07 у відсотках.", o:["7 %","70 %","0,7 %","0,07 %"], h:"Помнож на 100: кома переходить на два знаки вправо. 0,07 · 100 = 7."},
 {t:"Відсотки і десяткові дроби", q:"Запиши 45 % десятковим дробом.", o:["0,45","4,5","0,045","45"], h:"Поділи на 100: кома переходить на два знаки вліво. 45 : 100 = 0,45."},
 {t:"Відсотки і десяткові дроби", q:"Запиши 8 % десятковим дробом.", o:["0,08","0,8","8","0,008"], h:"8 : 100 — кома на два знаки вліво, бракує цифри, тому дописуємо нуль: 0,08."},
 {t:"Відсотки і десяткові дроби", q:"Запиши число 1,6 у відсотках.", o:["160 %","16 %","1,6 %","106 %"], h:"1,6 · 100 = 160. Число, більше за 1, — це більше ніж 100 %."},
 {t:"Відношення", q:"Вирази відношення \\(15 : 45\\) звичайним дробом.", o:["\\(\\frac{1}{3}\\)","\\(\\frac{1}{5}\\)","\\(3\\)","\\(\\frac{1}{30}\\)"], h:"Перше число — у чисельник, друге — у знаменник, потім скорочуємо на 15."},
 {t:"Поділ у відношенні", q:"Поділи 40 бананів у відношенні \\(3 : 5\\).", o:["15 і 25","3 і 5","24 і 16","12 і 28"], h:"3 + 5 = 8 частин, 40 : 8 = 5 бананів в одній частині, далі 5 · 3 і 5 · 5."},
 {t:"Поділ у відношенні", q:"Поділи 63 у відношенні \\(4 : 3\\).", o:["36 і 27","27 і 36","40 і 23","9 і 54"], h:"4 + 3 = 7 частин, 63 : 7 = 9. Перша частина відповідає першому числу: 9 · 4, потім 9 · 3."},
 {t:"Поділ у відношенні", q:"Вектор поділив 20 бананів у відношенні \\(1 : 4\\) так: «1 і 4». Як треба було поділити?", o:["4 і 16","1 і 4","5 і 15","2 і 18"], h:"Числа відношення — це кількість частин. 1 + 4 = 5 частин, 20 : 5 = 4 банани в частині."},
 {t:"Відсотки і відношення", q:"У класі 40 % хлопців і 60 % дівчат. Запиши відношення хлопці : дівчата.", o:["\\(2 : 3\\)","\\(3 : 2\\)","\\(40 : 100\\)","\\(1 : 6\\)"], h:"Прибери знак % і скороти: 40 : 60, ділимо на 20."},
 {t:"Відношення", q:"Скороти відношення \\(36 : 24 : 60\\).", o:["\\(3 : 2 : 5\\)","\\(2 : 3 : 5\\)","\\(3 : 2 : 6\\)","\\(4 : 3 : 5\\)"], h:"Усі три числа ділимо на одне число. Тут на 12, порядок чисел не змінюємо."},
 {t:"Поділ у відношенні", q:"Поділи 120 у відношенні \\(1 : 2 : 3\\).", o:["20, 40 і 60","10, 20 і 30","40, 40 і 40","20, 30 і 70"], h:"1 + 2 + 3 = 6 частин, 120 : 6 = 20, далі множимо 20 на кожне число відношення."},
 {t:"Дроби", q:"Виділи цілу частину з дробу \\(\\frac{29}{6}\\).", o:["\\(4\\frac{5}{6}\\)","\\(5\\frac{1}{6}\\)","\\(4\\frac{1}{6}\\)","\\(3\\frac{5}{6}\\)"], h:"29 : 6 = 4 (остача 5). Частка — ціла частина, остача — новий чисельник."},
 {t:"Відсотки і відношення", q:"Число поділили у відношенні \\(1 : 4\\). Скільки відсотків становить менша частина?", o:["20 %","25 %","10 %","40 %"], h:"Усе число — 100 %. 1 + 4 = 5 частин, 100 % : 5 = 20 % в одній частині."},
 {t:"Дроби", q:"Обчисли \\(2\\frac{1}{3} + 1\\frac{1}{2}\\).", o:["\\(3\\frac{5}{6}\\)","\\(3\\frac{2}{5}\\)","\\(4\\frac{1}{6}\\)","\\(2\\frac{5}{6}\\)"], h:"Цілі додаємо окремо: 2 + 1 = 3. Дроби зводимо до знаменника 6: 2/6 + 3/6 = 5/6."},
 {t:"Дроби", q:"Обчисли \\(1\\frac{1}{2} \\cdot 2\\frac{2}{3}\\).", o:["\\(4\\)","\\(2\\frac{1}{3}\\)","\\(3\\frac{1}{3}\\)","\\(4\\frac{1}{2}\\)"], h:"Мішані числа перетвори в неправильні дроби: 3/2 · 8/3, потім скороти."},
 {t:"Дроби", q:"Обчисли \\(\\frac{3}{4} : \\frac{9}{8}\\).", o:["\\(\\frac{2}{3}\\)","\\(\\frac{27}{32}\\)","\\(\\frac{3}{2}\\)","\\(\\frac{3}{8}\\)"], h:"Ділення замінюємо множенням на обернений дріб: 3/4 · 8/9, потім скорочуємо."},
 {t:"Відсотки і відношення", q:"На складі Грю 35 % яблук, 45 % груш, решта — сливи. Запиши відношення яблука : груші : сливи.", o:["\\(7 : 9 : 4\\)","\\(7 : 9 : 20\\)","\\(35 : 45 : 10\\)","\\(7 : 9 : 2\\)"], h:"Спершу знайди сливи: 100 % − 35 % − 45 % = 20 %. Потім 35 : 45 : 20 скороти на 5."}
];
const N = QS.length;

/* ===== Сховище і журнал ===== */
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let DEVICE = lsGet("mn-device","");
if(!DEVICE){ DEVICE = Math.random().toString(36).slice(2,8).toUpperCase(); lsSet("mn-device",DEVICE); }
let NAME = lsGet("mn-name","");
const LOG = lsGet("mn-log",[]);
function stamp(){ return new Date().toLocaleString("uk-UA"); }
function payload(d){ return Object.assign({time:stamp(), name:NAME, device:DEVICE}, d); }
function log(d){
  const row = payload(d);
  LOG.push(row); lsSet("mn-log",LOG);
  if(!SHEET_URL) return;
  try{ fetch(SHEET_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)}); }catch(e){}
}

/* ===== Допоміжне ===== */
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function plain(s){
  return String(s).replace(/\\\(|\\\)/g,"")
    .replace(/(\d)\\frac\{(\d+)\}\{(\d+)\}/g,"$1 $2/$3")
    .replace(/\\frac\{(\d+)\}\{(\d+)\}/g,"$1/$2")
    .replace(/\\cdot/g,"·").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
}
function math(el){
  if(window.renderMathInElement) renderMathInElement(el,{delimiters:[{left:"\\(",right:"\\)",display:false}],throwOnError:false});
  else setTimeout(()=>math(el),150);
}
function goggle(top,bottom,small){ return `<div class="goggle${small?" small":""}" aria-hidden="true"><div class="lens"><div><b>${top}</b>${bottom?`<small>${bottom}</small>`:""}</div></div></div>`; }
function strip(res,cur,anim){
  return `<div class="strip" aria-label="Зібрано бананів: ${res.filter(Boolean).length} з ${N}">`+
    Array.from({length:N},(_,k)=>{
      if(k<res.length) return res[k]?`<span class="slot${k===anim?" got":""}">🍌</span>`:`<span class="slot lost">✖</span>`;
      return `<span class="slot${k===cur?" now":""}"></span>`;
    }).join("")+`</div>`;
}

/* ===== Головна ===== */
function home(){
  S=null;
  const attempts = LOG.filter(r=>r.event==="Почала тест").length;
  app.innerHTML = `
  <section class="hero">
    ${goggle("🍌",N+" бананів")}
    <h1>Бананова місія Грю</h1>
    <p>Кожна правильна відповідь — банан у кошик. Збери всі ${N}!</p>
  </section>
  <div class="card">
    <label class="lbl" for="nm">Твоє ім’я</label>
    <input class="inp" id="nm" autocomplete="given-name" value="${esc(NAME)}" placeholder="Наприклад, Соломія">
    <button class="big" id="go">Почати тест</button>
    ${attempts?`<p class="note">Спроб тесту на цьому пристрої: ${attempts}</p>`:""}
  </div>`;
  const nm=document.getElementById("nm");
  function need(){ NAME=nm.value.trim(); lsSet("mn-name",NAME); if(!NAME){ nm.focus(); nm.placeholder="Спершу впиши ім’я"; return false; } return true; }
  document.getElementById("go").onclick=()=>{ if(need()) startTest(); };
  window.scrollTo(0,0);
}

/* ===== Тест ===== */
let S=null;
function startTest(){
  const attempt = LOG.filter(r=>r.event==="Почала тест").length+1;
  S={attempt, order:QS.map((_,i)=>i), i:0, res:[], t0:Date.now(), done:false};
  log({event:"Почала тест",attempt,q:TEST_TITLE});
  showQ(-1);
}
function showQ(anim){
  const q=QS[S.order[S.i]];
  const opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
  app.innerHTML=`
  <div class="bar"><button class="back" id="back">← Вийти</button><span class="count">Питання ${S.i+1} з ${N}</span></div>
  ${strip(S.res,S.i,anim)}
  <div class="qcard"><span class="topic">${q.t}</span><div>${q.q}</div></div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>
  <div id="fb"></div>`;
  math(app);
  document.getElementById("back").onclick=()=>{
    if(confirm("Вийти з тесту? Цю спробу буде перервано.")) abort(`на питанні ${S.i+1} з ${N}`), home();
  };
  const t1=Date.now();
  const btns=app.querySelectorAll(".opt");
  btns.forEach(b=>b.onclick=()=>{
    const ch=opts[+b.dataset.k];
    btns.forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add("dim"); });
    b.classList.add(ch.ok?"right":"wrong");
    if(!ch.ok) btns.forEach((x,k)=>{ if(opts[k].ok){ x.classList.remove("dim"); x.classList.add("right"); } });
    S.res.push(ch.ok);
    log({event:"Відповідь",attempt:S.attempt,num:S.i+1,q:plain(q.q),chosen:plain(ch.t),correct:plain(q.o[0]),ok:ch.ok,sec:Math.round((Date.now()-t1)/1000)});
    const last=S.i===N-1;
    const fb=document.getElementById("fb");
    fb.innerHTML=`<div class="fb ${ch.ok?"ok":"bad"}" role="status">
      <b>${ch.ok?pick(["Банана! 🍌","Белло! Правильно!","Грю пишається тобою!","Супер, ще один банан!"]):"Ой-ой, цей банан украв Вектор!"}</b>
      ${ch.ok?"":`<p>Як треба: ${q.h}</p>`}
      <button class="big ${ch.ok?"alt":""}" id="next">${last?"Показати результат":"Далі"}</button></div>`;
    app.querySelector(".strip").outerHTML=strip(S.res,S.i+1,ch.ok?S.i:-1);
    document.getElementById("next").onclick=()=>{ if(last) result(); else { S.i++; showQ(-1); } };
    fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  window.scrollTo(0,0);
}
function abort(where){
  if(!S||S.done) return;
  S.done=true;
  log({event:"Перервала тест",attempt:S.attempt,q:where,score:`${S.res.filter(Boolean).length} з ${N}`,sec:Math.round((Date.now()-S.t0)/1000)});
}
/* Якщо учениця закриє вкладку посеред тесту — теж надішлемо звіт */
window.addEventListener("pagehide",()=>{
  if(!S||S.done) return;
  S.done=true;
  const row=payload({event:"Перервала тест",attempt:S.attempt,q:`закрила сторінку на питанні ${S.i+1} з ${N}`,score:`${S.res.filter(Boolean).length} з ${N}`,sec:Math.round((Date.now()-S.t0)/1000)});
  LOG.push(row); lsSet("mn-log",LOG);
  if(SHEET_URL && navigator.sendBeacon) navigator.sendBeacon(SHEET_URL,JSON.stringify(row));
});

function rankOf(sc){
  const p=sc/N;
  if(p>=0.95) return ["Суперагент Грю 🏆","Майже всі банани твої — Грю в захваті!"];
  if(p>=0.75) return ["Права рука Грю ⭐","Чудово! Кілька бананів ще можна відвоювати."];
  if(p>=0.5)  return ["Помічник Грю 🍌","Непогано, але Вектор забрав чимало бананів."];
  return ["Міньйон-стажер 🔧","Повтори правила й спробуй ще раз — банани чекають!"];
}
function result(){
  S.done=true;
  const sc=S.res.filter(Boolean).length, [rank,msg]=rankOf(sc);
  const secs=Math.round((Date.now()-S.t0)/1000);
  log({event:"Завершила тест",attempt:S.attempt,score:`${sc} з ${N}`,sec:secs,q:TEST_TITLE});
  const tops={};
  S.order.forEach((qi,k)=>{ const t=QS[qi].t; tops[t]=tops[t]||[0,0]; tops[t][1]++; if(S.res[k]) tops[t][0]++; });
  app.innerHTML=`
  <section class="res">
    ${goggle(sc,"з "+N)}
    <div class="rank" style="margin-top:16px">${rank}</div>
    <p style="font-weight:800;margin:8px 0 0">${msg}</p>
    <p class="note">Спроба №${S.attempt}, час: ~${Math.max(1,Math.round(secs/60))} хв</p>
  </section>
  ${strip(S.res,-1,-1)}
  <div class="card">
    <h3>Результат за темами</h3>
    <ul class="topics">${Object.entries(tops).map(([t,[a,b]])=>`<li class="${a<b?"weak":""}"><span>${t}</span><span>${a} з ${b}</span></li>`).join("")}</ul>
  </div>
  <button class="big alt" id="again">Пройти тест ще раз</button>
  <button class="big ghost" id="home">На головну</button>`;
  document.getElementById("again").onclick=startTest;
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
